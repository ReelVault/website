name: Release web

# Builds the web release artifacts and publishes them as a GitHub release.
# Trigger: push a tag matching package.json (e.g. v1.0.0), or run manually
# from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (defaults to package.json)"
        required: false
      min_server_version:
        description: "Oldest compatible server version (optional, e.g. 1.1.0)"
        required: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  LEFTHOOK: "0" # skip git hooks installed by the `prepare` script

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(jq -r .version package.json)"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::invalid version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check version against package.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pkg="$(jq -r .version package.json)"
          if [ "$VERSION" != "$pkg" ]; then
            echo "::error::version $VERSION does not match package.json version $pkg"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types and run tests
        run: |
          bun run check-types
          bun test

      # Release gate: a tag on a broken commit must not produce artifacts.
      - name: Check types and run tests
        run: |
          bun run check-types
          bun test

      - name: Build release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          INPUT_MIN_SERVER_VERSION: ${{ github.event.inputs.min_server_version }}
        run: |
          set -euo pipefail
          min_server="${INPUT_MIN_SERVER_VERSION#v}"
          if [ -n "$min_server" ] && ! [[ "$min_server" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::invalid min_server_version: $min_server"
            exit 1
          fi
          args=( "$VERSION" )
          if [ -n "$min_server" ]; then
            args+=( --min-server-version "$min_server" )
          fi
          ./scripts/release-web.sh "${args[@]}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          assets=( dist/release/reelvault-web-*.zip dist/release/SHA256SUMS.txt )
          if [ -f dist/release/release.json ]; then
            assets+=( dist/release/release.json )
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ReelVault Web v$VERSION" \
              --generate-notes "${assets[@]}"
          fi